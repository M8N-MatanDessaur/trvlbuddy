[build]
  command = "npm run build"
  publish = "dist"

# The VAPID public key identifies this app server to the browser push
# services. It is public by design -- the browser needs it to create a
# subscription, so it ships in the bundle regardless -- which is why it lives
# here rather than in the Netlify UI. The matching PRIVATE key is an edge
# function secret (VAPID_PRIVATE_KEY) and must never appear in this file.
[build.environment]
  VITE_VAPID_PUBLIC_KEY = "BBhl4DsQ8_MM29hCfiZdvILQmyk7UMUl3z_Dllwu2JOTxzcE0LNdtqwmsnbzJHC26WYtra4dDpvdRs7Em3tCV1Q"

# The Google Places redirects that used to live here are gone. They proxied
# /api/places/* and /api/placesv1/* straight through to Google, which solved
# the CORS problem but still carried the API key from the browser -- and made
# this domain a convenient open proxy for anyone who had read the key out of
# the bundle. Everything now goes through the `places` edge function, which
# holds the key, requires a session, caps each user and caches for everybody.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
