    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-heal when a stale service worker served an old index.html that
      // points at chunk filenames that no longer exist on the server.
      // Unregister all SWs + clear caches, then reload so the next request
      // hits the live server and the new network-first SW takes over.
      var __recovering = false;
      function recoverFromStaleCache() {
        if (__recovering) return;
        __recovering = true;
        var done = function () { window.location.reload(); };
        try {
          var p = Promise.resolve();
          if ('serviceWorker' in navigator) {
            p = p.then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              });
            });
          }
          if ('caches' in window) {
            p = p.then(function () {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            });
          }
          p.then(done, done);
        } catch (_) {
          done();
        }
      }

      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.indexOf('Failed to fetch dynamically imported module') !== -1) {
          recoverFromStaleCache();
        }
      });
      window.addEventListener('vite:preloadError', recoverFromStaleCache);

      // A white screen with nothing in the console and nothing in the network
      // tab means the app never mounted, and the usual cause is something
      // stale being served from the worker's cache. There is no error to
      // listen for in that case, so watch for the outcome instead: if the
      // root is still empty a few seconds in, clear everything and reload
      // once. The flag makes it once, never a loop.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          try {
            if (sessionStorage.getItem('tb-recovered') === '1') return;
            sessionStorage.setItem('tb-recovered', '1');
          } catch (_) { return; }
          recoverFromStaleCache();
        }, 8000);
      });

    </script>
